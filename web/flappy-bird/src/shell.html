<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Flappy Bird. Клацання або пробіл — помах, P — пауза.">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'self' data:; font-src data:; base-uri 'none'; form-action 'none'">
  <title>Flappy Bird</title>
  <script>{{GAME_ROUTER_JS}}</script>
  <link rel="icon" href="{{ICON}}" type="image/svg+xml">
  <style>{{UPSTREAM_CSS}}</style>
  <style>
    @font-face { font-family: "Flappy Pixel"; src: url("{{PIXEL_FONT}}") format("truetype"); font-weight: 400 700; font-display: swap; }
    @font-face { font-family: "Bird Ref"; src: url("{{TINY_FONT}}") format("truetype"); font-weight: 100 900; font-display: swap; }
    :root { color-scheme: dark; font-family: "Trebuchet MS", Verdana, sans-serif; background: #211d20; color: #ded895; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    #flappy-stage { flex: 1; min-height: 0; padding: 12px 12px 0; justify-content: center; }
    #flappy-frame {
      width: min(100%, calc((100dvh - 76px) * 0.5625));
      height: min(calc(100dvh - 76px), calc((100vw - 24px) / 0.5625));
      flex: none; border-radius: 0; background: #211d20; box-shadow: none;
    }
    #flappy-frame:fullscreen, #flappy-frame.flappy-fake-fullscreen {
      width: 100vw; height: 100dvh; background: #211d20;
    }
    #flappy-frame:-webkit-full-screen { width: 100vw; height: 100dvh; background: #211d20; }
    #flappy-canvas { max-width: 100%; max-height: 100%; outline: none; }
    #flappy-canvas:focus-visible { outline: 2px solid #ded895; outline-offset: -2px; }
    footer {
      flex: none; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center;
      justify-content: center; gap: 8px 20px; padding: 12px 16px;
      color: #ded895; font-size: 13px; line-height: 1.5; text-align: center;
    }
    footer p { margin: 0; }
    #flappy-fullscreen, #group-retry {
      padding: 6px 12px; border: 1px solid #a39972; border-radius: 4px;
      background: transparent; color: #f4ebbd; font: inherit; line-height: 1.3;
    }
    #flappy-fullscreen:hover, #group-retry:hover { background: #40343b; }
    #group-record { flex-basis: 100%; min-width: 0; max-width: 100%; overflow-wrap: anywhere; line-break: anywhere; font: 16px/1.2 "Flappy Pixel", sans-serif; }
    #group-retry[hidden] { display: none; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .flappy-toggle:focus-visible ~ .flappy-switch { outline-color: #543847; }
    .flappy-version { opacity: 1; }
    .flappy-settings-close { color: #38212a; text-shadow: none; }
    .flappy-settings-panel { line-height: 1.4; max-height: 94%; overflow-y: auto; }
    #load-error { position: fixed; inset: 20% 12px auto; padding: 24px; background: #ded895; color: #543847; z-index: 40; text-align: center; }
    ::selection { background: #ded895; color: #211d20; }
    @media (max-width: 560px) {
      footer { min-height: 88px; gap: 4px 16px; font-size: 12px; padding: 8px; }
      #flappy-frame { width: min(100%, calc((100dvh - 100px) * 0.5625)); height: min(calc(100dvh - 100px), calc((100vw - 24px) / 0.5625)); }
    }
    @media (prefers-reduced-motion: reduce) { .flappy-switch, .flappy-switch::after { transition: none; } }
    .mobile-layout #flappy-stage {
      padding: calc(8px + var(--game-safe-top, 0px)) calc(8px + var(--game-safe-right, 0px)) 0 calc(8px + var(--game-safe-left, 0px));
    }
    .mobile-layout #flappy-frame {
      width: min(100%, calc(var(--game-available-height) * 0.5625));
      height: min(var(--game-available-height), calc((100vw - 16px - var(--game-safe-left, 0px) - var(--game-safe-right, 0px)) / 0.5625));
    }
    .mobile-layout footer {
      min-height: 44px; font-size: 11px; gap: 6px 10px;
      padding: 8px 8px calc(8px + var(--game-safe-bottom, 0px));
    }
    .mobile-layout #flappy-fullscreen, .mobile-layout #group-retry { padding: 5px 7px; min-height: 44px; }
    .mobile-layout .flappy-gear { width: 44px; height: 44px; }
    .mobile-layout #controls { max-width: 160px; line-height: 1.3; }
    .telegram-app .flappy-gear { top: 10px; right: 10px; }
    .telegram-app .flappy-safe-probe { padding-top: 0; }
    .mobile-layout #flappy-frame:fullscreen, .mobile-layout #flappy-frame.flappy-fake-fullscreen { width: 100vw; height: 100dvh; }
    .mobile-layout #flappy-frame:-webkit-full-screen { width: 100vw; height: 100dvh; }
  </style>
  <style>{{LEADERBOARD_CSS}}</style>
</head>
<body class="flappy-app">
  <main id="flappy-stage" aria-label="Flappy Bird">
    <div id="flappy-frame">
      <canvas id="flappy-canvas" width="288" height="512" tabindex="0" aria-label="Flappy Bird: торкнися екрана, клацни або натисни пробіл для помаху. Пауза — праворуч угорі. Після програшу натисни Play або пробіл." aria-describedby="controls flappy-result-description"></canvas>
      <p id="flappy-result-description" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></p>
      <div id="flappy-ui">
        <div id="flappy-result-actions" hidden>
          <button id="flappy-play-again" type="button" aria-label="Play — нова спроба"><img data-play-image alt="Play"></button>
          <button id="flappy-show-leaderboard" type="button" aria-label="Leaderboard"><img data-board-image alt="Leaderboard"></button>
        </div>
        <section id="flappy-leaderboard" aria-label="Leaderboard: топ-10 гравців" hidden>
          <header class="bird-board-header">
            <button id="flappy-board-back" class="bird-board-back" type="button" aria-label="Назад до результату"><span class="bird-board-back-plate"><canvas class="bird-board-arrow" width="14" height="14" aria-hidden="true"></canvas></span></button>
            <h1 class="bird-board-title">Leaderboard</h1>
          </header>
          <div class="bird-board-grass" aria-hidden="true"></div>
          <div class="bird-board-content">
            <h2 class="bird-list-title">Leaderboard</h2>
            <ol id="flappy-ranking" class="bird-ranking" aria-label="Топ-10 гравців"></ol>
            <p id="flappy-board-status" class="bird-board-status" role="status" aria-live="polite"></p>
            <button id="flappy-board-retry" class="bird-board-retry" type="button" hidden>Повторити</button>
          </div>
        </section>
      </div>
    </div>
  </main>
  <footer>
    <p id="group-record" role="status" aria-live="polite" hidden></p>
    <p id="controls">Клацання / Пробіл — помах <span aria-hidden="true">·</span> P — пауза</p>
    <button id="flappy-fullscreen" type="button" title="На весь екран (F). Вихід — Esc.">На весь екран</button>
    <button id="group-retry" type="button" hidden>Повторити</button>
  </footer>
  <p id="load-error" role="alert" hidden>Не вдалося завантажити зображення гри. Закрий гру та відкрий її знову.</p>
  <noscript><p>Щоб грати, увімкни JavaScript у налаштуваннях браузера.</p></noscript>
  <!-- Based on Vuila9's Flappy Bird v0.40, revision 0603529517b940f6b5db2d556d3083ee36884ea6.
       Source: https://github.com/vuila9/vuila9.github.io/tree/main/projects/Flappy_Bird

{{LICENSE}}

{{FONT_LICENSE}}
Tiny5 is bundled from the Google Fonts repository under the SIL Open Font License:
{{TINY_LICENSE}}
  -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>{{TELEGRAM_JS}}</script>
  <script>{{GROUP_JS}}</script>
  <script>{{ASSETS_JS}}</script>
  <script>{{LEADERBOARD_JS}}</script>
  <script>{{GAME_JS}}</script>
  <script>
    window.addEventListener("keydown", function (event) {
      if (event.code === "KeyF" && !event.repeat && !event.target.closest("input, button, a")) {
        event.preventDefault(); document.getElementById("flappy-fullscreen").click();
      }
    });
  </script>
</body>
</html>
